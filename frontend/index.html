<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MelodyMatch | Music Recommendations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg: #050505;
        --color-accent: #1DB954; /* Spotify Green */
        --color-surface: rgba(255, 255, 255, 0.03);
        --color-surface-hover: rgba(255, 255, 255, 0.08);
        --color-text-primary: #FFFFFF;
        --color-text-secondary: rgba(255, 255, 255, 0.6);
        --font-sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
        --glass-border: rgba(255, 255, 255, 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--color-bg);
        color: var(--color-text-primary);
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Mesh background */
      .mesh-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background:
          radial-gradient(circle at 20% 30%, #1db95433 0%, transparent 40%),
          radial-gradient(circle at 80% 70%, #1e3a8a33 0%, transparent 40%);
        z-index: -1;
      }

      .glass-panel {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        width: 920px;
        height: 660px;
        display: grid;
        grid-template-rows: auto 1fr;
        padding: 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        margin: 20px;
      }

      /* Header Section */
      header {
        text-align: center;
        margin-bottom: 24px;
      }

      h1 {
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -1px;
        margin-bottom: 4px;
      }

      p.subtitle {
        color: var(--color-text-secondary);
        font-size: 14px;
      }

      /* Search Section */
      .search-wrapper {
        width: 100%;
        max-width: 600px;
        margin: 0 auto 32px;
      }

      .search-container {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 12px 20px;
        transition: all 0.2s ease;
      }

      .search-container:focus-within {
        background: rgba(255, 255, 255, 0.12);
        border-color: var(--color-accent);
        box-shadow: 0 0 0 2px rgba(29, 185, 84, 0.2);
      }

      input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: var(--color-text-primary);
        font-size: 16px;
        font-family: var(--font-sans);
      }

      input::placeholder {
        color: var(--color-text-secondary);
        opacity: 0.5;
      }

      button.search-btn {
        background: var(--color-accent);
        color: #000;
        border: none;
        padding: 8px 24px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        margin-left: 12px;
        transition: transform 0.1s ease;
      }

      button.search-btn:active {
        transform: scale(0.95);
      }

      /* Results Section */
      .results-section {
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 16px;
        height: 100%;
        overflow: hidden;
      }

      .results-header {
        font-family: var(--font-mono);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: rgba(255, 255, 255, 0.5);
        font-weight: 700;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .song-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 16px;
        overflow-y: auto;
        padding-right: 8px;
        align-content: start;
      }

      /* Custom scrollbar */
      .song-list::-webkit-scrollbar {
        width: 4px;
      }
      .song-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .song-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }

      .song-card {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        padding: 16px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        gap: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        animation: slideIn 0.4s ease forwards;
        opacity: 0;
      }

      @keyframes slideIn {
        from { transform: translateY(10px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }

      .song-card:hover {
        background: rgba(255, 255, 255, 0.1);
        transform: translateY(-4px);
        border-color: rgba(255, 255, 255, 0.1);
      }

      .song-thumb {
  width: 100%;
  aspect-ratio: 1;
  background: linear-gradient(135deg, #282828 0%, #121212 100%);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
}

      .song-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .song-title {
        font-weight: 600;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .song-artist {
        color: var(--color-text-secondary);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .song-index {
        font-family: var(--font-mono);
        color: var(--color-accent);
        font-size: 10px;
        opacity: 0.7;
        margin-top: auto;
      }

      /* Loader */
      .loader {
        display: none;
        width: 24px;
        height: 24px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: var(--color-accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Error Message */
      .error-message {
        display: none;
        color: #ff4444;
        text-align: center;
        font-size: 13px;
        background: rgba(255, 68, 68, 0.1);
        padding: 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 68, 68, 0.2);
        margin-top: 16px;
      }

      /* Responsive adjustments */
      @media (max-width: 960px) {
        .glass-panel { width: 95%; height: 90vh; }
      }
      @media (max-width: 640px) {
        h1 { font-size: 24px; }
        .glass-panel { padding: 20px; }
        .song-list { grid-template-columns: 1fr; }
        body { overflow: auto; height: auto; display: block; }
      }
    </style>
  </head>
  <body>
    <div class="mesh-bg"></div>

    <div class="glass-panel">
      <header>
        <h1>MelodyMatch</h1>
        <p id="selection-display" class="subtitle">AI-powered music discovery</p>
      </header>

      <div class="results-section">
        <div class="search-wrapper">
          <form id="search-form" class="search-container">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5; min-width: 20px;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input
              type="text"
              id="song-input"
              placeholder="What's your favorite song?"
              autocomplete="off"
              required
            />
            <button type="submit" class="search-btn">Find</button>
          </form>
          <div id="loader" class="loader"></div>
          <div id="error-message" class="error-message"></div>
        </div>

        <div id="results-container" style="display: none; height: 100%; overflow: hidden; grid-template-rows: auto 1fr; gap: 16px;">
          <div class="results-header">
            <span id="results-label">Discovery results</span>
            <span id="results-count">---</span>
          </div>
          <div id="song-list" class="song-list">
            <!-- Songs will be injected here -->
          </div>
        </div>
      </div>
    </div>

    <script>
      const API_BASE = 'https://songrecommendation-production.up.railway.app';
      const searchForm = document.getElementById('search-form');
      const songInput = document.getElementById('song-input');
      let typingTimer;

      songInput.addEventListener("input", () => {
        clearTimeout(typingTimer);

        const value = songInput.value.trim();
        if (value.length < 2) return;

         typingTimer = setTimeout(() => {
          searchSongs(value);
        }, 300); // delay (debounce)
      });
      const loader = document.getElementById('loader');
      const errorMessage = document.getElementById('error-message');
      const resultsContainer = document.getElementById('results-container');
      const songList = document.getElementById('song-list');
      const resultsLabel = document.getElementById('results-label');
      const resultsCount = document.getElementById('results-count');
      const selectionDisplay = document.getElementById('selection-display');

      songInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
        e.preventDefault();
        searchForm.dispatchEvent(new Event("submit"));
        }
      });

      searchForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const songName = songInput.value.trim();
        if (!songName) return;

        searchSongs(songName);
      });

      async function searchSongs(songName) {
        songList.innerHTML = "";
        showLoading(true);
        hideError();
        resultsContainer.style.display = 'none';
        selectionDisplay.textContent = 'Searching for "' + songName + '"...';

        try {
          const response = await fetch(`${API_BASE}/recommend?song=${encodeURIComponent(songName)}`);
          if (!response.ok) throw new Error('Failed to fetch recommendations');

          const data = await response.json();
          handleResponse(data);
        } catch (err) {
          showError('Unable to connect to the backend API. Please make sure it is running at http://127.0.0.1:8000');
          selectionDisplay.textContent = 'AI-powered music discovery';
          console.error(err);
        } finally {
          showLoading(false);
        }
      }

      function handleResponse(data) {
        songList.innerHTML = '';

        if (data.matches && data.matches.length > 0) {
          resultsLabel.textContent = 'Found Matches';
          resultsCount.textContent = `${data.matches.length} matches`;
          selectionDisplay.textContent = `Results for "${songInput.value}" - select one`;
          data.matches.forEach((song, i) => {
            const card = createSongCard(song, i, true);
            songList.appendChild(card);
          });
          resultsContainer.style.display = 'grid';
        }
        else if (data.recommendations && data.recommendations.length > 0) {
          showRecommendations(data.recommendations);
        }
        else {
          showError('No tracks found matching your search. Try another one!');
          selectionDisplay.textContent = 'AI-powered music discovery';
        }
      }

      function showRecommendations(recommendations, selectedTrack = null) {
        songList.innerHTML = '';
        resultsLabel.textContent = 'Recommended for you';
        resultsCount.textContent = `${recommendations.length} tracks`;

        if (selectedTrack) {
          selectionDisplay.innerHTML = `Recommendations for <span style="color: var(--color-accent); font-weight: 600;">${selectedTrack.track_name}</span> by <span style="color: var(--color-accent); font-weight: 600;">${selectedTrack.artists}</span>`;
        }

        recommendations.forEach((song, i) => {
          const card = createSongCard(song, i, false);
          songList.appendChild(card);
        });

        resultsContainer.style.display = 'grid';
      }

      async function fetchByIndex(song) {
        showLoading(true);
        hideError();

        try {
          const response = await fetch(`${API_BASE}/recommend-by-index?index=${song.index}`);
          if (!response.ok) throw new Error('Failed to fetch by index');

          const data = await response.json();
          if (data.recommendations) {
            showRecommendations(data.recommendations, song);
          }
        } catch (err) {
          showError('Failed to get recommendations for this track.');
        } finally {
          showLoading(false);
        }
      }

      function createSongCard(song, index, isMatch) {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.style.animationDelay = `${index * 0.05}s`;

        card.innerHTML = `
          <div class="song-thumb">
  ${song.image ? `
    <img src="${song.image}"
         style="width:100%; height:100%; object-fit:cover; border-radius:10px;">
  ` : `
    <svg width="32" height="32" viewBox="0 0 24 24" fill="rgba(255,255,255,0.1)">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  `}
</div>
          <div class="song-info">
            <div class="song-title">${song.track_name}</div>
            <div class="song-artist">${song.artists}</div>
          </div>
          ${song.index !== undefined ? `<div class="song-index">ID: ${song.index}</div>` : ''}
        `;

        if (isMatch) {
          card.addEventListener('click', () => fetchByIndex(song));
        }

        return card;
      }

      function showLoading(show) {
        loader.style.display = show ? 'block' : 'none';
        searchForm.style.opacity = show ? '0.5' : '1';
        searchForm.style.pointerEvents = show ? 'none' : 'all';
      }

      function showError(msg) {
        errorMessage.textContent = msg;
        errorMessage.style.display = 'block';
      }

      function hideError() {
        errorMessage.style.display = 'none';
      }
    </script>
  </body>
</html>
